<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>Particles Demo | WebAssembly</title>
</head>

<body>
    <main class="container">
        <header class="head-text">
            <div class="first-line">
                <h1 class="title">Particles Demo</h1>
                <a href="https://github.com/Tanishq-Mehta-1/Particles" target="_blank" rel="noopener noreferrer" class="github-link">
                    <img src="../public/images/github_logo.png" alt="GitHub" class="github-logo" />
                </a>
            </div>
            <p class="subtitle">C++ and OpenGL app, ported to web using Emscripten</p>
            <p class="description">This interactive demo showcases real-time particle rendering directly in the browser via WebAssembly. Interact with the canvas below to explore the simulation.</p>

        <div class="particles-canvas">

        </div>

    <script>
        var Module = {
            canvas: document.getElementById('my-canvas')
        };
    </script>
    <script src="particles.js"></script>

</html>
